version: v2
clean: true
plugins:
  - local: protoc-gen-es
    out: src/generated
    opt:
      - target=ts
      - erasable_syntax=true
      - import_extension=ts
      - json_types=true
  - remote: buf.build/community/sudorandom-connect-openapi:v0.28.0
    out: openapi
    opt:
      - format=json
      - features=connectrpc
      - content-types=json
      - allow-get
      - with-service-descriptions
      - trim-unused-types
