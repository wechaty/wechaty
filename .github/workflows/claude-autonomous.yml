name: Claude Autonomous (Trusted Maintainers)

# Intentionally NOT triggered by public issue/PR comments.
# Only a maintainer with permission to run workflows can dispatch this job.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Existing branch for Claude to edit (never main)"
        required: true
        type: string
      task:
        description: "Specific coding task for Claude"
        required: true
        type: string

concurrency:
  group: claude-autonomous-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  claude:
    if: ${{ inputs.branch != 'main' && inputs.branch != 'master' && !startsWith(inputs.branch, 'refs/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout requested development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Claude Code with autonomous tool access
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            You are working on the checked-out branch: ${{ inputs.branch }}.
            Task from an authorized repository maintainer:
            ${{ inputs.task }}

            You have autonomous coding authority inside this ephemeral runner.
            Inspect the code, implement the task, run relevant tests and typechecks,
            and commit/push only to the checked-out development branch.
            Do not push to main, change GitHub security settings, modify secrets,
            or bypass required checks. Report exact commands, results, and commit SHA.
          claude_args: |
            --permission-mode bypassPermissions
