name: Claude Agent

# Subscription-backed Claude: human-directed coding and automatic PR reviews.
# Experimental @claude comment trigger; may overlap with native GitHub Claude.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

jobs:
  interactive:
    # Trusted human commands only. Action also checks actual write access.
    # Experimental start-of-comment @claude trigger with command boundary.
    if: >-
      (github.event_name == 'issues' &&
       github.event.label.name == 'agent:claude-action' &&
       github.event.sender.type != 'Bot') ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '@claude' || startsWith(github.event.comment.body, '@claude ') || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\r\n"'))))) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '@claude' || startsWith(github.event.comment.body, '@claude ') || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\r\n"'))))) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.type != 'Bot' &&
       (github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR') &&
       (github.event.review.body == '@claude' || startsWith(github.event.review.body, '@claude ') || startsWith(github.event.review.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.review.body, format('@claude{0}', fromJSON('"\r\n"')))))
    # Serialize human tasks and automatic reviews for the same issue/PR.
    # GitHub queue:max holds up to 100 pending jobs; overflow is canceled.
    # Anthropic tag mode may reject a queued command if a preceding job
    # pushed after that command's timestamp. Retry with a NEW @claude comment.
    concurrency:
      group: claude-agent-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Full execution experiment: do not install/enable the Claude Bash sandbox.
      # GitHub-hosted runners are ephemeral; no repository admin token is granted.
      - name: Claude interactive agent
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          label_trigger: agent:claude-action
          restrict_untrusted_prs: false
          additional_permissions: |
            actions: read
            contents: write
            pull_requests: write
            issues: write
          # Explicit full-execution experiment for trusted human commands.
          # Do not apply this to the automatic PR reviewer.
          claude_args: |
            --max-turns 50
            --dangerously-skip-permissions

      - name: Report Claude failure
        if: ${{ failure() }}
        run: |
          echo "::error::Claude failed. If another /claude task pushed to this PR while your command was queued, Anthropic's branch safety check may reject this stale request. After the earlier task completes, post a NEW @claude comment to retry. Check logs for the actual cause."

  review:
    # Single automatic reviewer. Draft PRs wait until ready_for_review.
    # Never execute a subscription-authenticated review on fork PR code.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (github.event.sender.type != 'Bot' ||
       contains(fromJSON('["Claude","Codex","claude[bot]","chatgpt-codex-connector[bot]","Copilot","copilot-pull-request-reviewer[bot]","copilot-swe-agent[bot]","gemini-code-assist[bot]"]'), github.event.sender.login)) &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # Share the same PR lock with interactive coding. A queued review may
    # become stale if the branch changes; it must not be treated as current.
    concurrency:
      group: claude-agent-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js for review
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up Deno for review
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify review target is current
        id: review-target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          current_base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.sha')"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$current_sha" != "$EXPECTED_SHA" ] || [ "$current_base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::warning::PR head changed while review was queued; skipping stale review. After coding finishes, a maintainer can move this PR to draft and then mark it ready for review, or close and reopen it, to trigger a NEW review event. Rerunning this old workflow will not refresh its event SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain stale review skip
        if: steps.review-target.outputs.current == 'false'
        run: |
          echo "### Claude review skipped: stale PR HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo "The PR changed after this event. After coding finishes, toggle draft → ready for review (or close → reopen) to request a new review. Rerunning this workflow retains the old event SHA." >> "$GITHUB_STEP_SUMMARY"

      # Store deduplication state as a commit status, not a PR comment.
      # The status context includes the BASE SHA so base changes require re-review.
      - name: Check completed review status for this revision
        id: review-duplicate
        if: steps.review-target.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          context="claude-agent/review/${EXPECTED_BASE_SHA}"
          if gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/statuses?per_page=100" --jq '.[] | select(.context == "'"$context"'" and .state == "success" and .creator.login == "github-actions[bot]") | .context' | grep -Fqx "$context"; then
            echo "already_reviewed=true" >> "$GITHUB_OUTPUT"
            echo "Already reviewed this exact HEAD/BASE revision." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already_reviewed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install review dependencies
        if: steps.review-target.outputs.current == 'true' && steps.review-duplicate.outputs.already_reviewed == 'false'
        run: npm ci --ignore-scripts

      # Native track_progress forces tag mode, which can treat a plugin command
      # as instructions rather than executing it. Track progress independently.
      - name: Start review progress
        id: review-progress
        if: steps.review-target.outputs.current == 'true' && steps.review-duplicate.outputs.already_reviewed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          marker="<!-- claude-review-progress:${EXPECTED_SHA}:${EXPECTED_BASE_SHA} -->"
          body="$(printf '%s\n\n%s\n\n%s\n' "$marker" '### Claude official Code Review plugin' 'Review started. Plugin execution and completion are not yet verified.')"
          comment_id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" --jq '.id')"
          echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"

      - name: Run Anthropic Code Review plugin
        if: steps.review-target.outputs.current == 'true' && steps.review-duplicate.outputs.already_reviewed == 'false'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: 'Claude,Codex,claude[bot],chatgpt-codex-connector[bot],Copilot,copilot-pull-request-reviewer[bot],copilot-swe-agent[bot],gemini-code-assist[bot]'
          restrict_untrusted_prs: false
          additional_permissions: |
            contents: write
            pull_requests: write
            issues: write
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          # Keep automation mode so the slash command is actually invoked.
          # Do NOT set track_progress: true: it forces tag mode.
          prompt: /code-review:code-review --comment
          claude_args: |
            --max-turns 100
            --dangerously-skip-permissions
            --allowedTools "Read,Glob,Grep,Bash,Task,mcp__github_inline_comment__create_inline_comment"

      # Pilot safety gate: action success alone can mean the plugin never ran.
      # Require evidence of completed specialist agents in the execution output.
      - name: Verify plugin review actually executed
        id: verify-plugin
        if: steps.claude-review.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const file = process.env.EXECUTION_FILE
          if (!file) throw new Error('Claude did not provide an execution output file')
          const raw = readFileSync(file, 'utf8')
          const records = []
          try { records.push(JSON.parse(raw)) } catch {}
          for (const line of raw.split('\n')) {
            try { records.push(JSON.parse(line)) } catch {}
          }
          const stats = []
          function visit(value, depth = 0) {
            if (!value || typeof value !== 'object' || depth > 12) return
            if (value.subagent_stats) stats.push(value.subagent_stats)
            for (const part of Object.values(value)) visit(part, depth + 1)
          }
          for (const record of records) visit(record)
          const verified = stats.some(s => Number(s.completed) >= 4 && Number(s.killed?.system ?? 0) === 0)
          if (!verified) {
            throw new Error('No evidence of four completed plugin reviewers; inspect execution output before trusting a green action')
          }
          console.log('Verified at least four completed code-review subagents')
          NODE

      - name: Update review progress
        if: always() && steps.review-progress.outputs.comment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ steps.review-progress.outputs.comment_id }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFIED: ${{ steps.verify-plugin.outcome }}
        run: |
          marker="<!-- claude-review-progress:${EXPECTED_SHA}:${EXPECTED_BASE_SHA} -->"
          if [ "$VERIFIED" = success ]; then
            message='Official plugin review agents completed. See the Claude review comment for findings (the plugin may omit comments if no high-confidence issues are found).'
          else
            message='Plugin review was NOT verified. Inspect the workflow run and execution output; do not treat this as a completed review.'
          fi
          body="$(printf '%s\n\n%s\n\n%s\n' "$marker" '### Claude official Code Review plugin' "$message")"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="$body" >/dev/null

      - name: Record completed review status for exact revision
        if: steps.verify-plugin.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          current_base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.sha')"
          if [ "$current_sha" != "$EXPECTED_SHA" ] || [ "$current_base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::warning::Plugin review ran but PR revision changed; do not record completion."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
              -f state=success \
              -f context="claude-agent/review/${EXPECTED_BASE_SHA}" \
              -f description="Anthropic code review agents completed for this HEAD/BASE" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          fi

      - name: Check whether reviewed HEAD changed
        if: steps.review-target.outputs.current == 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          current_base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.sha')"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$current_sha" != "$EXPECTED_SHA" ] || [ "$current_base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::warning::PR HEAD or BASE changed during Claude review. Any posted comments may be stale; request a NEW review on the current revision."
            echo "### Review may be stale" >> "$GITHUB_STEP_SUMMARY"
            echo "Expected HEAD/BASE: $EXPECTED_SHA / $EXPECTED_BASE_SHA; current HEAD/BASE: $current_sha / $current_base_sha. Trigger a new review with draft → ready after coding finishes." >> "$GITHUB_STEP_SUMMARY"
          fi
