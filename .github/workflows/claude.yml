name: Claude Subscription Agent

# Subscription-backed Claude coding only. Native @claude is separate.
# Automatic PR reviews live exclusively in claude-code-review.yml.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]

jobs:
  implement:
    # Never execute based on bot messages or arbitrary public comments.
    # The action performs its own write-permission check as an additional guard.
    if: >-
      (github.event_name == 'issues' &&
       github.event.label.name == 'agent:claude-action' &&
       (github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (startsWith(github.event.comment.body, '/claude ') ||
        github.event.comment.body == '/claude' ||
        startsWith(github.event.comment.body, '/claude\n'))) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (startsWith(github.event.comment.body, '/claude ') ||
        github.event.comment.body == '/claude' ||
        startsWith(github.event.comment.body, '/claude\n'))) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.type != 'Bot' &&
       (github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR') &&
       (startsWith(github.event.review.body, '/claude ') ||
        github.event.review.body == '/claude' ||
        startsWith(github.event.review.body, '/claude\n')))
    runs-on: ubuntu-latest
    # GitHub App installation tokens expire after ~60 minutes.
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Defense in depth: do not pass action secrets into spawned commands.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: /claude
          label_trigger: agent:claude-action
          restrict_untrusted_prs: true
          additional_permissions: |
            actions: read
          # No Bash(git:*): git can execute arbitrary programs (e.g. rebase --exec).
          # Leave commits and pushes to the action's guarded Git helpers.
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(deno:*)"

      - name: Report Claude action failure
        if: ${{ failure() }}
        run: |
          echo "::error::Claude action failed; inspect the Claude step logs. Do not treat a green workflow as proof of a completed coding task."
