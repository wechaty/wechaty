name: Claude Agent

# RFC #3001 explains how issue difficulty and PR risk select Claude's effort.
# https://github.com/wechaty/wechaty/issues/3001
# Subscription-backed Claude: human-directed coding and automatic PR reviews.
# Experimental @claude comment trigger; may overlap with native GitHub Claude.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

jobs:
  interactive:
    # Trusted human commands only. Action also checks actual write access.
    # Experimental start-of-comment @claude trigger with command boundary.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '@claude' || startsWith(github.event.comment.body, '@claude ') || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\r\n"'))))) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '@claude' || startsWith(github.event.comment.body, '@claude ') || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\r\n"'))))) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.type != 'Bot' &&
       (github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR') &&
       (github.event.review.body == '@claude' || startsWith(github.event.review.body, '@claude ') || startsWith(github.event.review.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.review.body, format('@claude{0}', fromJSON('"\r\n"')))))
    # Serialize human-directed tasks for the same issue/PR.
    # GitHub queue:max holds up to 100 pending jobs; overflow is canceled.
    # Anthropic tag mode may reject a queued command if a preceding job
    # pushed after that command's timestamp. Retry with a NEW @claude comment.
    concurrency:
      group: claude-interactive-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Resolve Claude effort
        id: effort
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolver="$RUNNER_TEMP/claude-effort.sh"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/claude-effort.sh?ref=main" \
            > "$resolver"
          bash "$resolver"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: React to the triggering issue comment 👀
        if: github.event_name == 'issue_comment' && !github.event.issue.pull_request
        id: issue-eyes
        continue-on-error: true
        shell: bash
        env:
          ISSUE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/claude-issue-eyes.sh"
          curl -fsSL --retry 3 --output "$script" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.github/scripts/claude-review-eyes.sh"
          bash "$script" start

      # Full execution experiment: do not install/enable the Claude Bash sandbox.
      # GitHub-hosted runners are ephemeral; no repository admin token is granted.
      - name: Claude interactive agent
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          restrict_untrusted_prs: false
          additional_permissions: |
            actions: read
            contents: write
            pull_requests: write
            issues: write
          # Explicit full-execution experiment for trusted human commands.
          # Do not apply this to the automatic PR reviewer.
          claude_args: |
            --effort ${{ steps.effort.outputs.level }}
            --append-system-prompt "Before investigating, use the native update_claude_comment tool to edit this run's existing progress comment in place. For an issue, use Working on issue #NUMBER as the progress heading. For a PR review, use Review of #NUMBER in progress as the progress heading and Claude review as the final heading. Append the effort suffix from the resolved title ${{ steps.effort.outputs.review_title }}, including the separator and emoji, to these headings. If the resolved title is simply Claude review, omit the suffix. For the final issue reply, replace the progress content with the answer. Omit the progress heading, any final heading, and the checklist. Above Medium, start with a Markdown blockquote on its own line in the form > Effort: 🦾 High, using the exact emoji and level from the resolved title. Follow it with a blank line, then the answer. At Medium, omit the effort line and start directly with the answer. Do not add a divider. Always update this run's same native comment and do not post a separate reply. For a PR review, include Reviewed HEAD SHA followed by the exact full SHA of the revision you reviewed in the final body."
            --max-turns 150
            --dangerously-skip-permissions

      - name: Clear Claude eyes from the triggering issue comment
        if: always() && steps.issue-eyes.outputs.reaction_id != ''
        continue-on-error: true
        shell: bash
        env:
          ISSUE_COMMENT_ID: ${{ github.event.comment.id }}
          REACTION_ID: ${{ steps.issue-eyes.outputs.reaction_id }}
        run: bash "$RUNNER_TEMP/claude-issue-eyes.sh" finish

      - name: Report Claude failure
        if: ${{ failure() }}
        run: |
          echo "::error::Claude failed. If another /claude task pushed to this PR while your command was queued, Anthropic's branch safety check may reject this stale request. After the earlier task completes, post a NEW @claude comment to retry. Check logs for the actual cause."

  review:
    # Single automatic reviewer. Draft PRs wait until ready_for_review.
    # Never execute a subscription-authenticated review on fork PR code.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (github.event.sender.type != 'Bot' ||
       contains(fromJSON('["Claude","Codex","claude[bot]","chatgpt-codex-connector[bot]","Copilot","copilot-pull-request-reviewer[bot]","copilot-swe-agent[bot]","gemini-code-assist[bot]"]'), github.event.sender.login)) &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # Serialize reviews per PR independently of human-directed tasks.
    # Preserve the running review, replacing obsolete pending reviews.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      queue: single
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    steps:
      # Fetch trusted script from immutable PR base commit before checkout/setup.
      - name: Start Claude review 👀
        id: eyes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/claude-review-eyes.sh"
          curl -fsSL --retry 3 --output "$script" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${EXPECTED_BASE_SHA}/.github/scripts/claude-review-eyes.sh"
          bash "$script" start

      - name: Explain stale review skip
        if: steps.eyes.outputs.current == 'false'
        run: |
          echo "### Claude review skipped: stale PR HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo "The PR changed after this event. Trigger a new review with draft → ready or close → reopen; rerunning this workflow retains the original event SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Claude effort
        if: steps.eyes.outputs.review_needed == 'true'
        id: effort
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolver="$RUNNER_TEMP/claude-effort.sh"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/claude-effort.sh?ref=main" \
            > "$resolver"
          bash "$resolver"

      - name: Checkout repository
        if: steps.eyes.outputs.review_needed == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for review
        if: steps.eyes.outputs.review_needed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '26'

      - name: Set up Deno for review
        if: steps.eyes.outputs.review_needed == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install review dependencies
        if: steps.eyes.outputs.review_needed == 'true'
        run: npm ci --ignore-scripts

      - name: Run Claude PR review (direct prompt)
        if: steps.eyes.outputs.review_needed == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # Work around headless sessions ending before background review agents.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          allowed_bots: 'Claude,Codex,claude[bot],chatgpt-codex-connector[bot],Copilot,copilot-pull-request-reviewer[bot],copilot-swe-agent[bot],gemini-code-assist[bot]'
          restrict_untrusted_prs: false
          additional_permissions: |
            contents: write
            pull_requests: write
            issues: write
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tag mode posts native progress while preserving the direct review prompt.
          track_progress: true
          # Direct review prompt: no plugin-wide "already commented" skip rule.
          # The existing HEAD/BASE guard handles duplicate revisions.
          show_full_output: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Review HEAD ${{ github.event.pull_request.head.sha }} against BASE ${{ github.event.pull_request.base.sha }}.

            During the review, use the native progress comment created for this run.
            Edit that same comment in place as work progresses; do not create
            additional progress comments. Use
            Review of #${{ github.event.pull_request.number }} in progress as the heading.
            Append the exact effort suffix from ${{ steps.effort.outputs.review_title }},
            including the separator and emoji. If the title is simply Claude review,
            omit the suffix. Preserve the progress checklist.
            Discover and use the available GitHub tools without requiring a specific tool name.

            This is an automatic review for the current revision, even if Claude has commented
            on this PR before. NEVER skip because of prior comments or earlier reviews.
            Read the applicable repository guidance, including AGENTS.md when present.
            Inspect the diff and relevant tests to establish the intended behavior and
            identify what could regress. Scale the investigation to the impact of the change.

            Trace consequential changes beyond the diff into callers, dependencies, and
            affected contracts. Check relevant edge cases, failure and recovery paths,
            compatibility, and whether tests would catch a regression in the changed behavior.

            Verify each candidate against the surrounding code before publishing it.
            Confirm that the affected path is reachable, the revision introduces the defect,
            and existing guards do not prevent it. For each actionable finding, cite the
            changed file and line, explain the trigger and observable consequence, and
            suggest a concrete fix. Briefly disclose any material area you could not assess.
            Do not modify the repository. Do not approve or merge the PR.
            When the review is complete, publish the findings as a formal GitHub
            Pull Request Review with the COMMENTED state, using available GitHub tools.
            This formal review is separate from the native progress comment.
            Include this heading exactly once in the formal review:
            ## ${{ steps.effort.outputs.review_title }}
            Include the findings or "No issues found.", and this exact line:
            Reviewed HEAD SHA: ${{ github.event.pull_request.head.sha }}
            Finalize this run's native progress comment in place without creating
            another progress comment. Do not edit comments from prior runs.
            Do not approve or merge the PR.
          claude_args: |
            --effort ${{ steps.effort.outputs.level }}
            --max-turns 150
            --dangerously-skip-permissions

      # Trust the successful Claude execution result; no internal-agent checks.
      - name: Verify Claude execution succeeded
        id: verify-plugin
        if: steps.claude-review.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          test -s "$EXECUTION_FILE"
          jq -e 'type == "array" and any(.[]; .type == "result" and .subtype == "success" and .is_error == false)' "$EXECUTION_FILE" >/dev/null
      - name: Record completed review status for exact revision
        if: steps.verify-plugin.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.head.sha, .base.sha] | @tsv')"
          if [[ "$current" != "${EXPECTED_SHA}"$'\t'"${EXPECTED_BASE_SHA}" ]]; then
            echo '::warning::PR revision changed during review; no success status recorded.'
            echo '### Review may be stale — trigger a new review on the current HEAD/BASE.' >> "$GITHUB_STEP_SUMMARY"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
              -f state=success -f context="claude-agent/review/${EXPECTED_BASE_SHA}" \
              -f description="Claude review completed for this HEAD/BASE" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          fi
      - name: Clear Claude eyes after review
        if: always() && steps.eyes.outputs.reaction_id != ''
        continue-on-error: true
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REACTION_ID: ${{ steps.eyes.outputs.reaction_id }}
        run: bash "$RUNNER_TEMP/claude-review-eyes.sh" finish
