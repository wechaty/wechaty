name: Claude Agent

# Subscription-backed Claude: human-directed coding and automatic PR reviews.
# Experimental @claude comment trigger; may overlap with native GitHub Claude.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

jobs:
  interactive:
    # Trusted human commands only. Action also checks actual write access.
    # Experimental start-of-comment @claude trigger with command boundary.
    if: >-
      (github.event_name == 'issues' &&
       github.event.label.name == 'agent:claude-action' &&
       github.event.sender.type != 'Bot') ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '@claude' || startsWith(github.event.comment.body, '@claude ') || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\r\n"'))))) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '@claude' || startsWith(github.event.comment.body, '@claude ') || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\r\n"'))))) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.type != 'Bot' &&
       (github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR') &&
       (github.event.review.body == '@claude' || startsWith(github.event.review.body, '@claude ') || startsWith(github.event.review.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.review.body, format('@claude{0}', fromJSON('"\r\n"')))))
    # Serialize human tasks and automatic reviews for the same issue/PR.
    # GitHub queue:max holds up to 100 pending jobs; overflow is canceled.
    # Anthropic tag mode may reject a queued command if a preceding job
    # pushed after that command's timestamp. Retry with a NEW @claude comment.
    concurrency:
      group: claude-agent-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Full execution experiment: do not install/enable the Claude Bash sandbox.
      # GitHub-hosted runners are ephemeral; no repository admin token is granted.
      - name: Claude interactive agent
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          label_trigger: agent:claude-action
          restrict_untrusted_prs: false
          additional_permissions: |
            actions: read
            contents: write
            pull_requests: write
            issues: write
          # Explicit full-execution experiment for trusted human commands.
          # Do not apply this to the automatic PR reviewer.
          claude_args: |
            --effort ultracode
            --max-turns 150
            --dangerously-skip-permissions

      - name: Report Claude failure
        if: ${{ failure() }}
        run: |
          echo "::error::Claude failed. If another /claude task pushed to this PR while your command was queued, Anthropic's branch safety check may reject this stale request. After the earlier task completes, post a NEW @claude comment to retry. Check logs for the actual cause."

  review:
    # Single automatic reviewer. Draft PRs wait until ready_for_review.
    # Never execute a subscription-authenticated review on fork PR code.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (github.event.sender.type != 'Bot' ||
       contains(fromJSON('["Claude","Codex","claude[bot]","chatgpt-codex-connector[bot]","Copilot","copilot-pull-request-reviewer[bot]","copilot-swe-agent[bot]","gemini-code-assist[bot]"]'), github.event.sender.login)) &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # Share the same PR lock with interactive coding. A queued review may
    # become stale if the branch changes; it must not be treated as current.
    concurrency:
      group: claude-agent-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    steps:
      # Fetch trusted script from immutable PR base commit before checkout/setup.
      - name: Start Claude review 👀
        id: eyes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/claude-review-eyes.sh"
          curl -fsSL --retry 3 --output "$script" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${EXPECTED_BASE_SHA}/.github/scripts/claude-review-eyes.sh"
          bash "$script" start

      - name: Explain stale review skip
        if: steps.eyes.outputs.current == 'false'
        run: |
          echo "### Claude review skipped: stale PR HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo "The PR changed after this event. Trigger a new review with draft → ready or close → reopen; rerunning this workflow retains the original event SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: steps.eyes.outputs.review_needed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for review
        if: steps.eyes.outputs.review_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up Deno for review
        if: steps.eyes.outputs.review_needed == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install review dependencies
        if: steps.eyes.outputs.review_needed == 'true'
        run: npm ci --ignore-scripts

      # The run URL is shared by reruns. Ignore comments from earlier attempts.
      - name: Record review start time
        if: steps.eyes.outputs.review_needed == 'true'
        id: review-start
        run: date -u '+started_at=%Y-%m-%dT%H:%M:%SZ' >> "$GITHUB_OUTPUT"

      - name: Run Claude PR review (direct prompt)
        if: steps.eyes.outputs.review_needed == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # Work around headless sessions ending before background review agents.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          allowed_bots: 'Claude,Codex,claude[bot],chatgpt-codex-connector[bot],Copilot,copilot-pull-request-reviewer[bot],copilot-swe-agent[bot],gemini-code-assist[bot]'
          restrict_untrusted_prs: false
          additional_permissions: |
            contents: write
            pull_requests: write
            issues: write
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tag mode posts native progress while preserving the direct review prompt.
          track_progress: true
          # Direct review prompt: no plugin-wide "already commented" skip rule.
          # The existing HEAD/BASE guard handles duplicate revisions.
          show_full_output: true
          # The action closes the SDK stream at its first result. Keep Claude
          # in the session while Ultracode's workflow is still running.
          settings: |
            {
              "hooks": {
                "Stop": [
                  {
                    "hooks": [
                      {
                        "type": "command",
                        "command": "if jq -e 'any(.background_tasks[]?; .type == \"workflow\")' >/dev/null; then\n  sleep 10\n  echo 'An Ultracode workflow is still running. Keep this session open. Wait in the foreground (for example, Bash sleep 30) and consume its completion result before publishing or ending the review.' >&2\n  exit 2\nfi",
                        "timeout": 20
                      }
                    ]
                  }
                ]
              }
            }
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Review HEAD ${{ github.event.pull_request.head.sha }} against BASE ${{ github.event.pull_request.base.sha }}.

            This is an automatic review for the current revision, even if Claude has commented
            on this PR before. NEVER skip because of prior comments or earlier reviews.
            Read the applicable repository guidance, including AGENTS.md when present.
            Inspect the diff and relevant tests to establish the intended behavior and
            identify what could regress. Scale the investigation to the impact of the change.

            Trace consequential changes beyond the diff into callers, dependencies, and
            affected contracts. Check relevant edge cases, failure and recovery paths,
            compatibility, and whether tests would catch a regression in the changed behavior.

            Verify each candidate against the surrounding code before publishing it.
            Confirm that the affected path is reachable, the revision introduces the defect,
            and existing guards do not prevent it. For each actionable finding, cite the
            changed file and line, explain the trigger and observable consequence, and
            suggest a concrete fix. Briefly disclose any material area you could not assess.
            Do not modify the repository. Do not approve or merge the PR.
            A Workflow launch acknowledgment is not a result. If you launch an Ultracode
            workflow, stay in this session and wait in the foreground for its completion
            notification and results. Read and incorporate the results before publishing.
            Only the parent session may update the PR comment. If the workflow fails,
            report the incomplete review without labeling it as a final code review.
            Publish the final review in the native progress comment created for this run.
            Load mcp__github_comment__update_claude_comment with ToolSearch and use it to
            update that same comment in place. Include exactly one "## Code review"
            heading, the findings or "No issues found.", and this exact line:
            Reviewed HEAD SHA: ${{ github.event.pull_request.head.sha }}
            Update the comment even if there are no findings. Do not create a separate
            comment or a GitHub review submission, and do not edit comments from prior runs.
          claude_args: |
            --effort ultracode
            --max-turns 150
            --dangerously-skip-permissions

      - name: Verify workflow completion and published review
        id: verify-review
        if: steps.claude-review.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.review-start.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          if ! test -s "$EXECUTION_FILE" || ! jq -e '
            def is($subtype): .type == "system" and .subtype == $subtype;
            ([.[] | select(.type == "result")] | last |
              .subtype == "success" and .is_error == false) and
            ([.[] | select(is("task_notification") and .status == "completed")] as $done |
              all(.[] | select(is("task_started") and .task_type == "local_workflow");
                . as $started | any($done[];
                  .task_id == $started.task_id and
                  (.run_id == null or $started.run_id == null or .run_id == $started.run_id))))
          ' "$EXECUTION_FILE" >/dev/null; then
            echo "::error::Claude did not finish the review or an Ultracode workflow is incomplete."
            exit 1
          fi

          run_link="(${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          if ! gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" |
            jq -e --arg link "$run_link" --arg since "$STARTED_AT" --arg sha "$EXPECTED_SHA" '
              [.[][] | select(.user.login == "claude[bot]" and .created_at >= $since and
                (.body | contains($link)))] |
              length == 1 and (.[0].body | split("\n") |
                map(select(. == "## Code review")) | length == 1) and
              (.[0].body | split("\n") | any(. == ("Reviewed HEAD SHA: " + $sha)))
            ' >/dev/null; then
            echo "::error::The native Claude comment is missing the final review or exact HEAD SHA."
            exit 1
          fi
      - name: Record completed review status for exact revision
        if: steps.verify-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.head.sha, .base.sha] | @tsv')"
          if [[ "$current" != "${EXPECTED_SHA}"$'\t'"${EXPECTED_BASE_SHA}" ]]; then
            echo '::warning::PR revision changed during review; no success status recorded.'
            echo '### Review may be stale — trigger a new review on the current HEAD/BASE.' >> "$GITHUB_STEP_SUMMARY"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
              -f state=success -f context="claude-agent/review/${EXPECTED_BASE_SHA}" \
              -f description="Claude review completed for this HEAD/BASE" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          fi
      - name: Clear Claude eyes after review
        if: always() && steps.eyes.outputs.reaction_id != ''
        continue-on-error: true
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REACTION_ID: ${{ steps.eyes.outputs.reaction_id }}
        run: bash "$RUNNER_TEMP/claude-review-eyes.sh" finish
