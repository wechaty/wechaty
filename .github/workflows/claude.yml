name: Claude Agent

# Subscription-backed Claude: human-directed coding and automatic PR reviews.
# Experimental @claude comment trigger; may overlap with native GitHub Claude.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

jobs:
  interactive:
    # Trusted human commands only. Action also checks actual write access.
    # Experimental start-of-comment @claude trigger with command boundary.
    if: >-
      (github.event_name == 'issues' &&
       github.event.label.name == 'agent:claude-action' &&
       github.event.sender.type != 'Bot') ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '@claude' || startsWith(github.event.comment.body, '@claude ') || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\r\n"'))))) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '@claude' || startsWith(github.event.comment.body, '@claude ') || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\r\n"'))))) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.type != 'Bot' &&
       (github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR') &&
       (github.event.review.body == '@claude' || startsWith(github.event.review.body, '@claude ') || startsWith(github.event.review.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.review.body, format('@claude{0}', fromJSON('"\r\n"')))))
    # Serialize human tasks and automatic reviews for the same issue/PR.
    # GitHub queue:max holds up to 100 pending jobs; overflow is canceled.
    # Anthropic tag mode may reject a queued command if a preceding job
    # pushed after that command's timestamp. Retry with a NEW @claude comment.
    concurrency:
      group: claude-agent-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Full execution experiment: do not install/enable the Claude Bash sandbox.
      # GitHub-hosted runners are ephemeral; no repository admin token is granted.
      - name: Claude interactive agent
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          label_trigger: agent:claude-action
          restrict_untrusted_prs: false
          additional_permissions: |
            actions: read
            contents: write
            pull_requests: write
            issues: write
          # Explicit full-execution experiment for trusted human commands.
          # Do not apply this to the automatic PR reviewer.
          claude_args: |
            --max-turns 50
            --dangerously-skip-permissions

      - name: Report Claude failure
        if: ${{ failure() }}
        run: |
          echo "::error::Claude failed. If another /claude task pushed to this PR while your command was queued, Anthropic's branch safety check may reject this stale request. After the earlier task completes, post a NEW @claude comment to retry. Check logs for the actual cause."

  review:
    # Single automatic reviewer. Draft PRs wait until ready_for_review.
    # Never execute a subscription-authenticated review on fork PR code.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (github.event.sender.type != 'Bot' ||
       contains(fromJSON('["Claude","Codex","claude[bot]","chatgpt-codex-connector[bot]","Copilot","copilot-pull-request-reviewer[bot]","copilot-swe-agent[bot]","gemini-code-assist[bot]"]'), github.event.sender.login)) &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # Share the same PR lock with interactive coding. A queued review may
    # become stale if the branch changes; it must not be treated as current.
    concurrency:
      group: claude-agent-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for review
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up Deno for review
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify review target is current
        id: review-target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          current_base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.sha')"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$current_sha" != "$EXPECTED_SHA" ] || [ "$current_base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::warning::PR head changed while review was queued; skipping stale review. After coding finishes, a maintainer can move this PR to draft and then mark it ready for review, or close and reopen it, to trigger a NEW review event. Rerunning this old workflow will not refresh its event SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain stale review skip
        if: steps.review-target.outputs.current == 'false'
        run: |
          echo "### Claude review skipped: stale PR HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo "The PR changed after this event. After coding finishes, toggle draft → ready for review (or close → reopen) to request a new review. Rerunning this workflow retains the old event SHA." >> "$GITHUB_STEP_SUMMARY"

      # Store deduplication state as a commit status, not a PR comment.
      # The status context includes the BASE SHA so base changes require re-review.
      - name: Check completed review status for this revision
        id: review-duplicate
        if: steps.review-target.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          context="claude-agent/review/${EXPECTED_BASE_SHA}"
          if gh api "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/statuses?per_page=100" --jq '.[] | select(.context == "'"$context"'" and .state == "success" and .creator.login == "github-actions[bot]") | .context' | grep -Fqx "$context"; then
            echo "already_reviewed=true" >> "$GITHUB_OUTPUT"
            echo "Already reviewed this exact HEAD/BASE revision." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already_reviewed=false" >> "$GITHUB_OUTPUT"
          fi

      # The trusted workflow supplies this helper inline (never run scripts
      # from PR HEAD). Use Anthropic's default OIDC exchange, then immediately
      # revoke the short-lived App token. No Claude inference is involved.
      - name: Prepare Claude App reaction helper
        if: steps.review-target.outputs.current == 'true' && steps.review-duplicate.outputs.already_reviewed == 'false'
        run: |
          cat > "$RUNNER_TEMP/claude-review-eyes.cjs" <<'NODE'
          ;(async () => {
            const { appendFileSync } = require('node:fs')
            const mode = process.env.REACTION_MODE
            const pr = process.env.PR_NUMBER
            const repo = process.env.GITHUB_REPOSITORY
            const summary = message => {
              console.log(message)
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, message + '\n')
            }
            const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN
            if (!requestUrl || !requestToken) throw Error('OIDC not available')
            const url = new URL(requestUrl)
            url.searchParams.set('audience', 'claude-code-github-action')
            const oidc = await fetch(url, {
              headers: { Authorization: 'bearer ' + requestToken }
            })
            if (!oidc.ok) throw Error('GitHub OIDC HTTP ' + oidc.status)
            const identity = (await oidc.json()).value
            if (!identity) throw Error('Missing OIDC identity')
            // Matches the verified official-action exchange: NO JSON body.
            const exchange = await fetch(
              'https://api.anthropic.com/api/github/github-app-token-exchange', {
                method: 'POST',
                headers: { Authorization: 'Bearer ' + identity }
              })
            if (!exchange.ok) throw Error('Anthropic exchange HTTP ' + exchange.status)
            const response = await exchange.json()
            const token = response.token || response.app_token
            if (!token) throw Error('Missing App credential')
            console.log('::add-mask::' + token)
            const api = (path, method = 'GET', body) => fetch(
              'https://api.github.com' + path, {
                method,
                headers: {
                  Authorization: 'Bearer ' + token,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  ...(body ? { 'Content-Type': 'application/json' } : {}),
                },
                ...(body ? { body: JSON.stringify(body) } : {}),
              })
            const base = '/repos/' + repo + '/issues/' + pr + '/reactions'
            try {
              if (mode === 'start') {
                // Do not claim ownership of a preexisting claude[bot] eye.
                const current = await api(base + '?per_page=100')
                if (!current.ok) throw Error('List reactions HTTP ' + current.status)
                const existing = await current.json()
                if (existing.some(r => r.content === 'eyes' && r.user?.login === 'claude[bot]')) {
                  summary('Existing Claude eyes reaction retained; no duplicate created.')
                } else {
                  const created = await api(base, 'POST', { content: 'eyes' })
                  if (!created.ok) throw Error('Create eyes HTTP ' + created.status)
                  const reaction = await created.json()
                  if (reaction.user?.login !== 'claude[bot]' || !reaction.id) {
                    throw Error('Unexpected reaction author or missing ID')
                  }
                  appendFileSync(process.env.GITHUB_OUTPUT, 'reaction_id=' + reaction.id + '\n')
                  summary('claude[bot] eyes reaction added.')
                }
              } else if (mode === 'finish' && process.env.REACTION_ID) {
                const removed = await api(base + '/' + process.env.REACTION_ID, 'DELETE')
                if (removed.status !== 204 && removed.status !== 404) {
                  throw Error('Delete eyes HTTP ' + removed.status)
                }
                summary('claude[bot] eyes reaction cleared.')
              } else if (mode !== 'finish') {
                throw Error('Invalid reaction mode')
              }
            } finally {
              // Never persist the App token between GitHub Actions steps.
              const revoked = await api('/installation/token', 'DELETE')
              if (revoked.status !== 204) throw Error('App token revoke HTTP ' + revoked.status)
            }
          })().catch(error => {
            // Report only locally created status strings, never token payloads.
            console.error('Claude reaction helper failed: ' + error.message)
            process.exitCode = 1
          })
          NODE

      - name: Add Claude eyes to PR while reviewing
        id: review-eyes
        if: steps.review-target.outputs.current == 'true' && steps.review-duplicate.outputs.already_reviewed == 'false'
        continue-on-error: true
        env:
          REACTION_MODE: start
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node "$RUNNER_TEMP/claude-review-eyes.cjs"

      - name: Install review dependencies
        if: steps.review-target.outputs.current == 'true' && steps.review-duplicate.outputs.already_reviewed == 'false'
        run: npm ci --ignore-scripts

      # Native track_progress forces tag mode, which can treat a plugin command
      # as instructions rather than executing it. Use Actions checks for status.
      # Capture a timestamp for run-specific review publication verification
      # without creating a GitHub PR discussion comment.
      - name: Mark review start
        id: review-start
        if: steps.review-target.outputs.current == 'true' && steps.review-duplicate.outputs.already_reviewed == 'false'
        run: echo "created_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Run Anthropic Code Review plugin
        if: steps.review-target.outputs.current == 'true' && steps.review-duplicate.outputs.already_reviewed == 'false'
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # Work around headless sessions ending before background review agents.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          allowed_bots: 'Claude,Codex,claude[bot],chatgpt-codex-connector[bot],Copilot,copilot-pull-request-reviewer[bot],copilot-swe-agent[bot],gemini-code-assist[bot]'
          restrict_untrusted_prs: false
          additional_permissions: |
            contents: write
            pull_requests: write
            issues: write
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Install through the official Action inputs. A CLI --plugin-dir
          # flag in claude_args was not carried into the SDK options in the
          # failed pilot and the Action reported "No plugins specified".
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          # Automation mode executes slash commands; native track_progress
          # selects tag mode; use Actions checks rather than PR progress comments.
          prompt: /code-review:code-review https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
          claude_args: |
            --max-turns 100
            --dangerously-skip-permissions
            --allowedTools "Read,Glob,Grep,Bash,Task,mcp__github_inline_comment__create_inline_comment"

      # Attribute published feedback to THIS Claude execution, not merely
      # to claude[bot] and a recent timestamp. Otherwise a concurrent native
      # Claude session can make a skipped plugin look successfully reviewed.
      - name: Verify plugin review actually executed
        id: verify-plugin
        if: steps.claude-review.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_STARTED: ${{ steps.review-start.outputs.created_at }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const file = process.env.EXECUTION_FILE
          if (!file) throw Error('Claude execution file missing; action may have skipped execution')
          let events
          try { events = JSON.parse(readFileSync(file, 'utf8')) }
          catch { throw Error('Invalid Claude execution JSON') }
          if (!Array.isArray(events) || !events.length) throw Error('No Claude execution messages')
          if (!events.some(e => e.type === 'result' && e.subtype === 'success' && e.is_error === false))
            throw Error('Claude did not report a successful terminal result')
          const calls = new Map()
          const results = new Map()
          function scan(x, depth = 0) {
            if (!x || typeof x !== 'object' || depth > 16) return
            if (x.type === 'tool_use' && x.id) calls.set(x.id, x)
            if (x.type === 'tool_result' && x.tool_use_id) results.set(x.tool_use_id, x)
            for (const v of Object.values(x)) scan(v, depth + 1)
          }
          events.forEach(x => scan(x))
          const repo = process.env.GITHUB_REPOSITORY
          const pr = process.env.PR_NUMBER
          const prefix = 'https://github.com/' + repo + '/pull/' + pr
          const started = process.env.REVIEW_STARTED
          if (!started) throw Error('Missing review start timestamp')
          const api = route => JSON.parse(execFileSync('gh', ['api', route], { encoding: 'utf8' }))
          const textOf = x => typeof x === 'string' ? x : JSON.stringify(x ?? '')
          let verified = 0
          for (const [id, call] of calls) {
            const command = String(call.input?.command ?? '')
            const inline = call.name === 'mcp__github_inline_comment__create_inline_comment'
            const summary = call.name === 'Bash' && /(^|\s)gh\s+pr\s+comment(\s|$)/.test(command)
            if (!inline && !summary) continue
            const result = results.get(id)
            if (!result || result.is_error === true) continue
            const output = textOf(result.content)
            if (/error:|permission denied|failed to|not found/i.test(output)) continue
            // Only trust URLs returned by the matching publishing tool call.
            // Do not scan all PR comments; another Claude session may race us.
            const urls = [...output.matchAll(/https:\/\/github\.com\/[^\s"'\\]+/g)].map(m => m[0])
            const ids = [...new Set(urls.map(url => {
              if (!url.startsWith(prefix)) return null
              const issue = url.match(/#issuecomment-(\d+)/)
              const review = url.match(/#discussion_r(\d+)/)
              return issue ? ['issue', issue[1]] : review ? ['inline', review[1]] : null
            }).filter(Boolean).map(pair => pair.join(':')))]
            for (const entry of ids) {
              const [kind, commentId] = entry.split(':')
              if ((kind === 'inline') !== inline) continue
              const route = kind === 'issue'
                ? 'repos/' + repo + '/issues/comments/' + commentId
                : 'repos/' + repo + '/pulls/comments/' + commentId
              const published = api(route)
              if (published.user?.login !== 'claude[bot]') continue
              if (!published.created_at || published.created_at < started) continue
              if (kind === 'issue') {
                if (!String(published.html_url ?? '').startsWith(prefix + '#issuecomment-')) continue
                if (!String(published.body ?? '').includes('## Code review')) continue
              } else {
                if (!String(published.html_url ?? '').startsWith(prefix + '#discussion_r')) continue
                if (published.commit_id !== process.env.EXPECTED_SHA) continue
              }
              console.log('Verified output from this execution: ' + kind + ' comment ' + commentId)
              verified++
            }
          }
          if (!verified) throw Error('No review artifact tied to this Claude execution. Plugin may have skipped or returned unsupported tool output.')
          NODE

      - name: Record completed review status for exact revision
        if: steps.verify-plugin.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          current_base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.sha')"
          if [ "$current_sha" != "$EXPECTED_SHA" ] || [ "$current_base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::warning::Plugin review ran but PR revision changed; do not record completion."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
              -f state=success \
              -f context="claude-agent/review/${EXPECTED_BASE_SHA}" \
              -f description="Anthropic code review agents completed for this HEAD/BASE" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          fi

      # Re-authenticate as the same Claude App to delete our reaction.
      # The first token was revoked immediately after posting.
      - name: Clear Claude eyes after review
        if: always() && steps.review-eyes.outputs.reaction_id != ''
        continue-on-error: true
        env:
          REACTION_MODE: finish
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REACTION_ID: ${{ steps.review-eyes.outputs.reaction_id }}
        run: node "$RUNNER_TEMP/claude-review-eyes.cjs"

      - name: Check whether reviewed HEAD changed
        if: steps.review-target.outputs.current == 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          current_base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.sha')"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [ "$current_sha" != "$EXPECTED_SHA" ] || [ "$current_base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::warning::PR HEAD or BASE changed during Claude review. Any posted comments may be stale; request a NEW review on the current revision."
            echo "### Review may be stale" >> "$GITHUB_STEP_SUMMARY"
            echo "Expected HEAD/BASE: $EXPECTED_SHA / $EXPECTED_BASE_SHA; current HEAD/BASE: $current_sha / $current_base_sha. Trigger a new review with draft → ready after coding finishes." >> "$GITHUB_STEP_SUMMARY"
          fi
