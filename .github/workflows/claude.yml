name: Claude Agent

# Subscription-backed Claude: human-directed coding and automatic PR reviews.
# Native GitHub @claude remains a separate, Copilot-billed route.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  interactive:
    # Trusted human commands only. Action also checks actual write access.
    # Require a command boundary: end, space, LF, or CRLF.
    if: >-
      (github.event_name == 'issues' &&
       github.event.label.name == 'agent:claude-action' &&
       (github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '/claude' || startsWith(github.event.comment.body, '/claude ') || startsWith(github.event.comment.body, format('/claude{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('/claude{0}', fromJSON('"\r\n"'))))) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '/claude' || startsWith(github.event.comment.body, '/claude ') || startsWith(github.event.comment.body, format('/claude{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('/claude{0}', fromJSON('"\r\n"'))))) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.type != 'Bot' &&
       (github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR') &&
       (github.event.review.body == '/claude' || startsWith(github.event.review.body, '/claude ') || startsWith(github.event.review.body, format('/claude{0}', fromJSON('"\n"'))) || startsWith(github.event.review.body, format('/claude{0}', fromJSON('"\r\n"')))))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Claude interactive agent
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: /claude
          label_trigger: agent:claude-action
          restrict_untrusted_prs: true
          additional_permissions: |
            actions: read
          # Do not grant unrestricted Edit, Write, or Git Bash tools.
          # Tag mode provides its own guarded workspace edits and git helpers.
          # Explicit interpreter grants remain denied on untrusted PRs by
          # the action's disallowedTools policy.
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Glob,Grep,Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(deno:*)"

      - name: Report Claude failure
        if: ${{ failure() }}
        run: echo "::error::Claude failed; check the run logs and verify task completion."

  review:
    # Single automatic reviewer. Draft PRs wait until ready_for_review.
    # Never execute a subscription-authenticated review on fork PR code.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.actor != 'Copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # Scope GitHub access to this job's GITHUB_TOKEN, not the action's
          # default OIDC-minted App token (which has contents write).
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
