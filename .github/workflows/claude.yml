name: Claude Agent

# RFC #3001 explains how issue difficulty and PR risk select Claude's effort.
# https://github.com/wechaty/wechaty/issues/3001
# Subscription-backed Claude: human-directed coding and automatic PR reviews.
# Experimental @claude comment trigger; may overlap with native GitHub Claude.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

jobs:
  interactive:
    # Trusted human commands only. Action also checks actual write access.
    # Experimental start-of-comment @claude trigger with command boundary.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '@claude' || startsWith(github.event.comment.body, '@claude ') || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\r\n"'))))) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '@claude' || startsWith(github.event.comment.body, '@claude ') || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.comment.body, format('@claude{0}', fromJSON('"\r\n"'))))) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.type != 'Bot' &&
       (github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR') &&
       (github.event.review.body == '@claude' || startsWith(github.event.review.body, '@claude ') || startsWith(github.event.review.body, format('@claude{0}', fromJSON('"\n"'))) || startsWith(github.event.review.body, format('@claude{0}', fromJSON('"\r\n"')))))
    # Serialize human-directed tasks for the same issue/PR.
    # GitHub queue:max holds up to 100 pending jobs; overflow is canceled.
    # Anthropic tag mode may reject a queued command if a preceding job
    # pushed after that command's timestamp. Retry with a NEW @claude comment.
    concurrency:
      group: claude-interactive-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Resolve Claude effort
        id: effort
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolver="$RUNNER_TEMP/claude-effort.sh"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/claude-effort.sh?ref=main" \
            > "$resolver"
          bash "$resolver"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: React to the triggering issue comment 👀
        if: github.event_name == 'issue_comment' && !github.event.issue.pull_request
        id: issue-eyes
        continue-on-error: true
        shell: bash
        env:
          ISSUE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/claude-issue-eyes.sh"
          curl -fsSL --retry 3 --output "$script" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/.github/scripts/claude-review-eyes.sh"
          bash "$script" start

      - name: Claude interactive agent
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          additional_permissions: |
            actions: read
            contents: write
            pull_requests: write
            issues: write
          claude_args: |
            --effort ${{ steps.effort.outputs.level }}
            --allowedTools "Bash(gh pr review:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Work on the trusted @claude request. Follow AGENTS.md. Keep one native progress/reply comment and edit it in place. For issue replies above Medium, start with the matching effort blockquote (for example > Effort: 🦾 High), followed by a blank line. At Medium, start with the answer. Use the resolved review title ${{ steps.effort.outputs.review_title }} for PR reviews and publish a formal COMMENT review with gh on the reviewed HEAD."
            --max-turns 150
            --permission-mode acceptEdits

      - name: Clear Claude eyes from the triggering issue comment
        if: always() && steps.issue-eyes.outputs.reaction_id != ''
        continue-on-error: true
        shell: bash
        env:
          ISSUE_COMMENT_ID: ${{ github.event.comment.id }}
          REACTION_ID: ${{ steps.issue-eyes.outputs.reaction_id }}
        run: bash "$RUNNER_TEMP/claude-issue-eyes.sh" finish

  review:
    # Single automatic reviewer. Draft PRs wait until ready_for_review.
    # Never execute a subscription-authenticated review on fork PR code.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (github.event.sender.type != 'Bot' ||
       contains(fromJSON('["Claude","Codex","claude[bot]","chatgpt-codex-connector[bot]","Copilot","copilot-pull-request-reviewer[bot]","copilot-swe-agent[bot]","gemini-code-assist[bot]"]'), github.event.sender.login)) &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # Serialize reviews per PR independently of human-directed tasks.
    # Preserve the running review, replacing obsolete pending reviews.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      queue: single
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    steps:
      # Fetch trusted script from immutable PR base commit before checkout/setup.
      - name: Start Claude review 👀
        id: eyes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/claude-review-eyes.sh"
          curl -fsSL --retry 3 --output "$script" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${EXPECTED_BASE_SHA}/.github/scripts/claude-review-eyes.sh"
          bash "$script" start

      - name: Resolve Claude effort
        if: steps.eyes.outputs.review_needed == 'true'
        id: effort
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolver="$RUNNER_TEMP/claude-effort.sh"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/claude-effort.sh?ref=main" \
            > "$resolver"
          bash "$resolver"

      - name: Checkout repository
        if: steps.eyes.outputs.review_needed == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for review
        if: steps.eyes.outputs.review_needed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '26'

      - name: Set up Deno for review
        if: steps.eyes.outputs.review_needed == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Configure Claude review tool
        if: steps.eyes.outputs.review_needed == 'true'
        id: review-tool
        shell: bash
        env:
          REVIEW_TITLE: ${{ steps.effort.outputs.review_title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          trusted_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          trusted_sha="$(git rev-parse --verify "$trusted_ref")"
          # Anthropic only authorizes workflows matching the default branch.
          if ! git diff --quiet "$trusted_sha" "$GITHUB_SHA" -- .github/workflows/claude.yml; then
            echo '::notice::Claude review skipped because this PR changes the Claude workflow. Test the deployed workflow on a fresh PR.'
            exit 0
          fi
          # This process inherits the App credential. Load its code from the
          # trusted default branch so a PR cannot replace it.
          server="$RUNNER_TEMP/claude-review-mcp.mjs"
          config="$RUNNER_TEMP/claude-review-mcp.json"
          git show "$trusted_sha:.github/scripts/claude-review-mcp.mjs" > "$server"
          jq -n --arg server "$server" --arg title "$REVIEW_TITLE" \
            '{mcpServers: {claude_review: {command: "node", args: [$server, $title]}}}' > "$config"
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: Run Claude PR review (direct prompt)
        if: steps.review-tool.outputs.config != ''
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # Work around headless sessions ending before background review agents.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          allowed_bots: 'Claude,Codex,claude[bot],chatgpt-codex-connector[bot],Copilot,copilot-pull-request-reviewer[bot],copilot-swe-agent[bot],gemini-code-assist[bot]'
          additional_permissions: |
            contents: write
            pull_requests: write
            issues: write
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tag mode posts native progress while preserving the direct review prompt.
          track_progress: true
          prompt: |
            Review https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }} at HEAD ${{ github.event.pull_request.head.sha }} against BASE ${{ github.event.pull_request.base.sha }}. Follow AGENTS.md, leave actionable findings inline, and submit a formal Comment review.
          claude_args: |
            --effort ${{ steps.effort.outputs.level }}
            --mcp-config "${{ steps.review-tool.outputs.config }}"
            --allowedTools "mcp__claude_review__submit_review,mcp__github_inline_comment__create_inline_comment"
            --max-turns 150
            --permission-mode default

      - name: Verify publication and record revision status
        if: steps.claude-review.outcome == 'success' && steps.claude-review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          REVIEW_TITLE: ${{ steps.effort.outputs.review_title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.state, .head.sha, .base.sha] | @tsv')"
          if [[ "$current" != "open"$'\t'"${EXPECTED_SHA}"$'\t'"${EXPECTED_BASE_SHA}" ]]; then
            echo '::warning::PR revision changed during review; no success status recorded.'
            echo '### Review may be stale — trigger a new review on the current HEAD/BASE.' >> "$GITHUB_STEP_SUMMARY"
          else
            test -s "$EXECUTION_FILE"
            jq -e 'type == "array" and any(.[]; .type == "result" and .subtype == "success" and .is_error == false)' "$EXECUTION_FILE" >/dev/null
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" |
              jq -e --arg head "$EXPECTED_SHA" --arg title "## $REVIEW_TITLE" \
                --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '
                any(.[][]; .user.login == "claude[bot]" and .state == "COMMENTED" and .commit_id == $head
                  and ((.body // "") | split("\n") | index($title)) != null
                  and ((.body // "") | contains("(" + $run + ")")))
              ' >/dev/null || {
                echo '::error::Claude did not publish a formal review for the expected HEAD.'
                exit 1
              }
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
              -f state=success -f context="claude-agent/review/${EXPECTED_BASE_SHA}" \
              -f description="Claude review completed for this HEAD/BASE" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          fi
      - name: Clear Claude eyes after review
        if: always() && steps.eyes.outputs.reaction_id != ''
        continue-on-error: true
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REACTION_ID: ${{ steps.eyes.outputs.reaction_id }}
        run: bash "$RUNNER_TEMP/claude-review-eyes.sh" finish
