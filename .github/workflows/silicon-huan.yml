name: 'Disposable #3161 verdict recovery test'
'on':
  workflow_dispatch:
    inputs:
      number:
        required: true
        type: string
permissions: {}
jobs:
  probe:
    if: github.actor == 'huan' && github.ref == 'refs/heads/test/3161-reconcile-harness'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
    - name: Create repository-scoped Huan installation token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: "${{ vars.APP_CLIENT_ID_HUAN }}"
        private-key: "${{ secrets.APP_PRIVATE_KEY_HUAN }}"
        owner: "${{ github.repository_owner }}"
        repositories: "${{ github.event.repository.name }}"
        permission-contents: read
        permission-pull-requests: write
    - name: Prepare disposable review evidence
      id: fixture
      uses: actions/github-script@v8
      env:
        NUMBER: "${{ inputs.number }}"
        VERDICT_FILE: "${{ runner.temp }}/huan-verdict.json"
      with:
        github-token: "${{ steps.app-token.outputs.token }}"
        script: |
          const {writeFile} = await import('node:fs/promises')
          const pull = {...context.repo, pull_number: Number(process.env.NUMBER)}
          const {data: pr} = await github.rest.pulls.get(pull)
          if (!pr.draft || !['test/3161-reconcile-head', 'test/3161-reconcile-base'].includes(pr.head.ref)) {
            throw new Error('Expected a disposable draft PR')
          }
          core.setOutput('head', pr.head.sha)
          core.setOutput('base', pr.base.sha)
          const {data: summary} = await github.rest.pulls.createReview({
            ...pull, commit_id: pr.head.sha, event: 'COMMENT',
            body: `## Huanˢⁱ ⚡ review\n<!-- huan-reviewed-base base=${pr.base.sha} -->\nDisposable timing fixture.`,
          })
          await writeFile(process.env.VERDICT_FILE, JSON.stringify({
            reviewId: summary.id, event: 'REQUEST_CHANGES', body: 'Disposable #3161 timing verdict.',
          }))
    - name: Publish revision-checked verdict
      id: verdict
      uses: actions/github-script@v8
      env:
        NUMBER: "${{ inputs.number }}"
        HEAD_SHA: "${{ steps.fixture.outputs.head }}"
        BASE_SHA: "${{ steps.fixture.outputs.base }}"
        APP_LOGIN: "${{ steps.app-token.outputs.app-slug }}[bot]"
        VERDICT_FILE: "${{ runner.temp }}/huan-verdict.json"
      with:
        github-token: "${{ steps.app-token.outputs.token }}"
        script: |
          context.eventName = 'pull_request_target'
          const { readFile } = await import('node:fs/promises')
          const { HEAD_SHA, BASE_SHA, APP_LOGIN, VERDICT_FILE } = process.env
          const pull = { ...context.repo, pull_number: Number(process.env.NUMBER) }
          const runMarker = `<!-- huan-verdict run=${context.runId} head=${HEAD_SHA} base=${BASE_SHA} -->`
          const pairMarker = `<!-- huan-review-pair head=${HEAD_SHA} base=${BASE_SHA} -->`
          const isCurrent = async () => {
            const { data } = await github.rest.pulls.get(pull)
            return data.state === 'open' && data.head.sha === HEAD_SHA && data.base.sha === BASE_SHA
          }
          const findVerdict = async () => {
            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...pull, per_page: 100 })
            return reviews.find(review => review.user?.login === APP_LOGIN && review.commit_id === HEAD_SHA
              && ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)
              && review.body?.split(/\r?\n/).includes(runMarker))
          }
          const partial = reason => core.setOutput('partial', reason)

          // Reruns and ambiguous POST failures recover a specific verdict without replaying the write.
          let verdict
          if (process.env.GITHUB_RUN_ATTEMPT !== '1') {
            verdict = await findVerdict()
            if (!verdict) {
              partial('unconfirmed')
              throw new Error('No verdict found for this run. Inspect the PR before requesting a fresh review.')
            }
          }
          if (!verdict) {
            if (!await isCurrent()) return partial('skipped')
            const { reviewId, event, body } = JSON.parse(await readFile(VERDICT_FILE, 'utf8'))
            if (!Number.isSafeInteger(reviewId) || !['APPROVE', 'REQUEST_CHANGES'].includes(event)
              || typeof body !== 'string' || !body.trim()) throw new Error('Invalid review verdict handoff')
            const { data: review } = await github.rest.pulls.getReview({ ...pull, review_id: reviewId })
            if (review.user?.login !== APP_LOGIN || review.commit_id !== HEAD_SHA
              || review.state !== 'COMMENTED' || !/^## Huanˢⁱ ⚡ review[ \t]*\r?\n/.test(review.body ?? '')
              || !review.body.split(/\r?\n/).includes(`<!-- huan-reviewed-base base=${BASE_SHA} -->`)) {
              throw new Error('Verdict handoff does not identify the formal review for this HEAD and BASE')
            }
            if (!await isCurrent()) return partial('skipped')
            try {
          const { data: signal } = await github.rest.issues.createComment({
            ...context.repo, issue_number: pull.pull_number, body: 'Disposable trial: final preflight passed. Ready for the revision move.',
          })
          core.notice(`Fixture timing signal: ${signal.html_url}`)
          const deadline = Date.now() + 180_000
          while (await isCurrent()) {
            if (Date.now() >= deadline) throw new Error('Fixture revision did not move')
            await new Promise(resolve => setTimeout(resolve, 1000))
          }
              const result = await github.rest.pulls.createReview({
                ...pull, commit_id: HEAD_SHA, event, body: `${body.trim()}\n\n— Huanˢⁱ ⚡\n\n${runMarker}`,
              })
              verdict = result.data
            } catch (error) {
              partial('unconfirmed')
              verdict = await findVerdict()
              if (!verdict) throw error
            }
          }

          partial('unconfirmed')
          const target = { ...pull, review_id: verdict.id }
          const current = await isCurrent()
          if (verdict.state === 'DISMISSED') {
            return partial('dismissed')
          }
          if (!current) {
            try {
              await github.rest.pulls.dismissReview({
                ...target, message: 'Huanˢⁱ ⚡ withdrew this verdict because the reviewed HEAD or BASE changed.',
              })
            } catch (error) {
              const { data } = await github.rest.pulls.getReview(target)
              if (data.state !== 'DISMISSED') throw error
            }
            return partial('withdrawn')
          }
          // Only a confirmed automatic verdict completes a pair. Withdrawn verdicts never get this marker.
          if (context.eventName === 'pull_request_target' && !verdict.body.endsWith(pairMarker)) {
            await github.rest.pulls.updateReview({ ...target, body: `${verdict.body}\n\n${pairMarker}` })
          }
          partial('')
