name: Huanˢⁱ ⚡
permissions: {}
env:
  AGY_CLI_DISABLE_AUTO_UPDATE: 'true'
jobs:
  authorize:
    if: github.actor == 'huan' && github.ref == 'refs/heads/test/3161-recovery-lifecycle'
      && inputs.mode == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      authorized: "${{ steps.context.outputs.authorized }}"
      number: "${{ steps.context.outputs.number }}"
      sha: "${{ steps.context.outputs.sha }}"
      base: "${{ steps.context.outputs.base }}"
      task: "${{ steps.context.outputs.task }}"
      mode: "${{ steps.context.outputs.mode }}"
      target_url: "${{ steps.context.outputs.target_url }}"
      request_url: "${{ steps.context.outputs.request_url }}"
    steps:
    - name: Authorize human and resolve immutable context
      id: context
      uses: actions/github-script@v8
      env:
        INPUT_NUMBER: "${{ inputs.number }}"
        INPUT_TASK: "${{ inputs.task }}"
        INPUT_MODE: "${{ inputs.mode }}"
      with:
        script: |
          const { owner, repo } = context.repo
          const p = context.payload
          const automatic = context.eventName === 'pull_request_target'
          const eventPR = automatic ? p.pull_request : undefined
          const source = p.comment ?? p.review ?? (context.eventName === 'issues' ? p.issue : undefined)
          if (source && (source.user.type !== 'User' || !/^@huan(?:\s|$)/i.test(source.body ?? ''))) return
          const actor = source?.user.login ?? context.actor
          // Authorize the event actor, rerun initiator, and (for automatic reviews) the PR author.
          const actors = new Set([actor, process.env.GITHUB_TRIGGERING_ACTOR])
          if (eventPR) actors.add(eventPR.user.login)
          for (const username of actors) {
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username })
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              if (automatic) {
                core.notice('Automatic review skipped because a repository write permission check failed.')
                return
              }
              throw new Error('Repository write permission required')
            }
          }
          const number = Number(p.issue?.number ?? p.pull_request?.number ?? process.env.INPUT_NUMBER)
          if (!Number.isSafeInteger(number) || number <= 0) throw new Error('Invalid issue/PR number')
          const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number })
          let sha, base = ''
          if (issue.pull_request) {
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number })
            if (!pr.head.ref.startsWith('test/3161-')) throw new Error('Disposable PR required')
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) throw new Error('Fork PRs are excluded')
            if (eventPR && process.env.GITHUB_RUN_ATTEMPT === '1' && (pr.state !== 'open' || pr.draft || pr.head.sha !== eventPR.head.sha || pr.base.sha !== eventPR.base.sha)) {
              core.notice('Automatic review skipped because the PR changed since the event.')
              return
            }
            sha = eventPR?.head.sha ?? pr.head.sha
            base = eventPR?.base.sha ?? pr.base.sha
          } else {
            const { data: repository } = await github.rest.repos.get({ owner, repo })
            sha = (await github.rest.repos.getBranch({ owner, repo, branch: repository.default_branch })).data.commit.sha
          }
          let task = source ? source.body.replace(/^@huan(?:\s|$)/i, '').trim() : (process.env.INPUT_TASK ?? '').trim()
          const reviewCommand = source && issue.pull_request && /^review(?:\s|$)/i.test(task)
          const mode = (automatic || (source ? reviewCommand : process.env.INPUT_MODE === 'review')) ? 'review' : 'interaction'
          if (mode === 'review' && !issue.pull_request) throw new Error('Review mode requires a pull request')
          if (reviewCommand) task = task.slice('review'.length).trim()
          if (!source && mode === 'interaction' && !task) throw new Error('Interaction dispatch requires a task')
          const target_url = issue.html_url
          const request_url = source?.html_url ?? ''
          for (const [key, value] of Object.entries({ number, sha, base, task, mode, target_url, request_url, authorized: 'true' })) {
            core.setOutput(key, String(value))
          }
  agent:
    name: Huanˢⁱ ⚡ (${{ needs.authorize.outputs.mode }})
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: antigravity-next-${{ github.repository }}-${{ needs.authorize.outputs.number
        }}-${{ github.event_name == 'pull_request_target' && 'auto' || 'requested'
        }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: Create repository-scoped Huan installation token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: "${{ vars.APP_CLIENT_ID_HUAN }}"
        private-key: "${{ secrets.APP_PRIVATE_KEY_HUAN }}"
        owner: "${{ github.repository_owner }}"
        repositories: "${{ github.event.repository.name }}"
        permission-contents: read
        permission-pull-requests: write
    - name: Open or reuse progress comment
      id: progress
      if: needs.authorize.outputs.mode == 'review' || github.event_name == 'workflow_dispatch'
        || github.event_name == 'pull_request_review'
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        TARGET_NUMBER: "${{ needs.authorize.outputs.number }}"
        MODE: "${{ needs.authorize.outputs.mode }}"
        APP_LOGIN: "${{ steps.app-token.outputs.app-slug }}[bot]"
      with:
        github-token: "${{ steps.app-token.outputs.token }}"
        script: |
          const { owner, repo } = context.repo
          const target = { owner, repo, issue_number: Number(process.env.TARGET_NUMBER) }
          const marker = `<!-- antigravity-next-progress run=${context.runId} -->`
          const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
          const activity = process.env.MODE === 'review' ? 'Review' : 'Task'
          const body = `${marker}\n### Huanˢⁱ ⚡ · ${activity} started\n\n[Actions run](${run})`

          // Reruns keep the same run ID. Reuse only this app's comment for that run.
          if (process.env.GITHUB_RUN_ATTEMPT !== '1') {
            for await (const page of github.paginate.iterator(github.rest.issues.listComments, { ...target, per_page: 100 })) {
              const previous = page.data.find(comment =>
                comment.user?.login === process.env.APP_LOGIN && comment.body?.includes(marker))
              if (!previous) continue
              const intent = previous.body.split(/\r?\n/).find(line =>
                /^<!-- huan-verdict-intent head=[0-9a-f]{40} base=[0-9a-f]{40} -->$/.test(line))
              if (process.env.MODE === 'review' && intent) {
                core.setOutput('recovery', 'true')
              } else {
                await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body })
              }
              core.setOutput('url', previous.html_url)
              core.setOutput('comment_id', String(previous.id))
              return
            }
          }
          if (process.env.MODE === 'review' && process.env.GITHUB_RUN_ATTEMPT !== '1') {
            // No prior comment means we cannot prove the previous write was never attempted.
            core.setOutput('recovery', 'true')
          }
          const { data } = await github.rest.issues.createComment({ ...target, body })
          core.setOutput('url', data.html_url)
          core.setOutput('comment_id', String(data.id))
    - name: Verify review revision is still current
      if: needs.authorize.outputs.mode == 'review' && steps.progress.outputs.recovery
        != 'true'
      shell: bash
      env:
        GH_TOKEN: "${{ github.token }}"
        NUMBER: "${{ needs.authorize.outputs.number }}"
        HEAD_SHA: "${{ needs.authorize.outputs.sha }}"
        BASE_SHA: "${{ needs.authorize.outputs.base }}"
      run: |
        set -euo pipefail
        current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '.head.sha + " " + .base.sha')"
        if [[ "$current" != "$HEAD_SHA $BASE_SHA" ]]; then
          echo '::error::PR revision changed. Request a review of the current revision.'
          exit 1
        fi
    - name: Create automatic review reaction token
      id: reaction-token
      if: steps.progress.outputs.comment_id != ''
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: "${{ vars.APP_CLIENT_ID_HUAN }}"
        private-key: "${{ secrets.APP_PRIVATE_KEY_HUAN }}"
        owner: "${{ github.repository_owner }}"
        repositories: "${{ github.event.repository.name }}"
        permission-issues: write
        permission-pull-requests: write
    - name: Start request reactions
      id: reactions
      if: github.event_name == 'issues' || github.event_name == 'issue_comment' ||
        github.event_name == 'pull_request_review_comment' || steps.progress.outputs.comment_id
        != ''
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        PROGRESS_ID: "${{ steps.progress.outputs.comment_id }}"
        APP_LOGIN: "${{ steps.app-token.outputs.app-slug }}[bot]"
      with:
        github-token: "${{ steps.reaction-token.outputs.token || steps.app-token.outputs.token
          }}"
        script: |
          const { owner, repo } = context.repo
          const p = context.payload
          const usesProgress = !['issues', 'issue_comment', 'pull_request_review_comment'].includes(context.eventName)
          const target = context.eventName === 'issues' ? `issues/${p.issue.number}`
            : context.eventName === 'issue_comment' ? `issues/comments/${p.comment.id}`
            : context.eventName === 'pull_request_review_comment' ? `pulls/comments/${p.comment.id}`
            : `issues/comments/${process.env.PROGRESS_ID}`
          const endpoint = `/repos/${owner}/${repo}/${target}/reactions`
          core.setOutput('endpoint', endpoint)
          try {
            // A progress comment belongs to one run, so a rerun can clear abandoned progress there.
            const stale = usesProgress ? ['hooray', 'eyes', 'rocket'] : ['hooray']
            const filters = usesProgress ? {} : { content: 'hooray' }
            for await (const page of github.paginate.iterator(`GET ${endpoint}`, { ...filters, per_page: 100 })) {
              for (const reaction of page.data.filter(r => r.user?.login === process.env.APP_LOGIN && stale.includes(r.content))) {
                await github.request(`DELETE ${endpoint}/${reaction.id}`)
              }
            }
          } catch (error) {
            core.warning(`Could not clear previous run reactions: ${error.message}`)
          }
          const { status, data } = await github.request(`POST ${endpoint}`, { content: 'eyes' })
          // A 200 reuses an existing reaction, which this run does not own.
          if (status === 201) core.setOutput('eyes_id', String(data.id))
    - name: Check for a completed automatic review pair
      id: pair
      if: github.event_name == 'pull_request_target' && steps.progress.outputs.recovery
        != 'true'
      shell: bash
      env:
        GH_TOKEN: "${{ steps.app-token.outputs.token }}"
        NUMBER: "${{ needs.authorize.outputs.number }}"
        HEAD_SHA: "${{ needs.authorize.outputs.sha }}"
        BASE_SHA: "${{ needs.authorize.outputs.base }}"
        APP_LOGIN: "${{ steps.app-token.outputs.app-slug }}[bot]"
      run: |
        set -euo pipefail
        marker="<!-- huan-review-pair head=$HEAD_SHA base=$BASE_SHA -->"
        if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/reviews?per_page=100" |
          jq -e --arg login "$APP_LOGIN" --arg sha "$HEAD_SHA" --arg marker "$marker" '
            any(.[][]; .user.login == $login and .commit_id == $sha
              and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
              and ((.body // "") | endswith($marker)))
          ' >/dev/null; then
          echo 'duplicate=true' >> "$GITHUB_OUTPUT"
          exit 0
        else
          status=("${PIPESTATUS[@]}")
          if [[ "${status[0]}" != 0 || "${status[1]}" != 1 ]]; then
            echo '::error::Could not check for an existing automatic review.'
            exit 1
          fi
        fi
    - name: Mark Huanˢⁱ ⚡ as running
      id: rocket
      if: steps.reactions.outputs.endpoint != '' && steps.pair.outputs.duplicate !=
        'true' && steps.progress.outputs.recovery != 'true'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: "${{ steps.reaction-token.outputs.token || steps.app-token.outputs.token
          }}"
        ENDPOINT: "${{ steps.reactions.outputs.endpoint }}"
        EYES_ID: "${{ steps.reactions.outputs.eyes_id }}"
      run: |
        set -euo pipefail
        if [[ -n "$EYES_ID" ]]; then
          gh api --method DELETE "$ENDPOINT/$EYES_ID" --silent ||
            echo '::warning::Could not remove preparation reaction; cleanup will retry.'
        fi
        # Keep the reaction credential in this step and track only a rocket created by this attempt.
        response="$(gh api --include --method POST "$ENDPOINT" -f content=rocket --jq .id)"
        read -r _ status _ <<< "$response"
        rocket_id="$(tail -n 1 <<< "$response")"
        if [[ "$status" == 201 && "$rocket_id" =~ ^[0-9]+$ ]]; then
          echo "rocket_id=$rocket_id" >> "$GITHUB_OUTPUT"
        fi
    - name: Run Huanˢⁱ ⚡
      if: steps.pair.outputs.duplicate != 'true' && steps.progress.outputs.recovery
        != 'true'
      id: agent
      env:
        VERDICT_FILE: "${{ runner.temp }}/huan-verdict.json"
        NUMBER: "${{ needs.authorize.outputs.number }}"
        COMMENT_ID: "${{ steps.progress.outputs.comment_id }}"
        HEAD_SHA: "${{ needs.authorize.outputs.sha }}"
        BASE_SHA: "${{ needs.authorize.outputs.base }}"
      uses: actions/github-script@v8
      with:
        github-token: "${{ steps.app-token.outputs.token }}"
        script: |
          const { writeFile } = await import('node:fs/promises')
          const { NUMBER, HEAD_SHA, BASE_SHA, VERDICT_FILE } = process.env
          const { data } = await github.rest.pulls.createReview({
            ...context.repo, pull_number: Number(NUMBER), commit_id: HEAD_SHA, event: 'COMMENT',
            body: `## Huanˢⁱ ⚡ review\n<!-- huan-reviewed-base base=${BASE_SHA} -->\nDisposable lifecycle fixture.`,
          })
          await writeFile(VERDICT_FILE, JSON.stringify({ reviewId: data.id, event: 'REQUEST_CHANGES', body: 'Disposable #3161 timing verdict.' }))
    - name: Publish revision-checked verdict
      id: verdict
      if: needs.authorize.outputs.mode == 'review' && steps.pair.outputs.duplicate
        != 'true'
      uses: actions/github-script@v8
      env:
        COMMENT_ID: "${{ steps.progress.outputs.comment_id }}"
        RECOVERY: "${{ steps.progress.outputs.recovery }}"
        NUMBER: "${{ needs.authorize.outputs.number }}"
        HEAD_SHA: "${{ needs.authorize.outputs.sha }}"
        BASE_SHA: "${{ needs.authorize.outputs.base }}"
        APP_LOGIN: "${{ steps.app-token.outputs.app-slug }}[bot]"
        VERDICT_FILE: "${{ runner.temp }}/huan-verdict.json"
        TRIAL: "${{ inputs.task }}"
      with:
        github-token: "${{ steps.app-token.outputs.token }}"
        script: |
          context.eventName = 'pull_request_target'
          const { readFile } = await import('node:fs/promises')
          const { APP_LOGIN, VERDICT_FILE, RECOVERY } = process.env
          let { HEAD_SHA, BASE_SHA } = process.env
          const pull = { ...context.repo, pull_number: Number(process.env.NUMBER) }
          const progress = { ...context.repo, comment_id: Number(process.env.COMMENT_ID) }
          const partial = reason => core.setOutput('partial', reason)
          if (!progress.comment_id) {
            partial('unconfirmed')
            throw new Error('A progress comment is required to track verdict publication.')
          }
          if (RECOVERY === 'true') {
            partial('unconfirmed')
            const { data } = await github.rest.issues.getComment(progress)
            const intent = data.body.match(/^<!-- huan-verdict-intent head=([0-9a-f]{40}) base=([0-9a-f]{40}) -->$/m)
            if (!intent) throw new Error('No saved verdict intent. Inspect the PR before requesting a fresh review.')
            HEAD_SHA = intent[1]
            BASE_SHA = intent[2]
          }
          const runMarker = `<!-- huan-verdict run=${context.runId} head=${HEAD_SHA} base=${BASE_SHA} -->`
          const pairMarker = `<!-- huan-review-pair head=${HEAD_SHA} base=${BASE_SHA} -->`
          const isCurrent = async () => {
            const { data } = await github.rest.pulls.get(pull)
            return data.state === 'open' && data.head.sha === HEAD_SHA && data.base.sha === BASE_SHA
          }
          const findVerdict = async () => {
            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...pull, per_page: 100 })
            return reviews.find(review => review.user?.login === APP_LOGIN && review.commit_id === HEAD_SHA
              && ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)
              && review.body?.split(/\r?\n/).includes(runMarker))
          }
          // Reruns and ambiguous POST failures recover a specific verdict without replaying the write.
          let verdict
          if (RECOVERY === 'true') {
            verdict = await findVerdict()
            if (!verdict) {
              partial('unconfirmed')
              throw new Error('No verdict found for this run. Inspect the PR before requesting a fresh review.')
            }
          }
          if (!verdict) {
            if (!await isCurrent()) return partial('skipped')
            const { reviewId, event, body } = JSON.parse(await readFile(VERDICT_FILE, 'utf8'))
            if (!Number.isSafeInteger(reviewId) || !['APPROVE', 'REQUEST_CHANGES'].includes(event)
              || typeof body !== 'string' || !body.trim()) throw new Error('Invalid review verdict handoff')
            const { data: review } = await github.rest.pulls.getReview({ ...pull, review_id: reviewId })
            if (review.user?.login !== APP_LOGIN || review.commit_id !== HEAD_SHA
              || review.state !== 'COMMENTED' || !/^## Huanˢⁱ ⚡ review[ \t]*\r?\n/.test(review.body ?? '')
              || !review.body.split(/\r?\n/).includes(`<!-- huan-reviewed-base base=${BASE_SHA} -->`)) {
              throw new Error('Verdict handoff does not identify the formal review for this HEAD and BASE')
            }
            const { data: comment } = await github.rest.issues.getComment(progress)
            const progressBody = comment.body
            const intent = `<!-- huan-verdict-intent head=${HEAD_SHA} base=${BASE_SHA} -->`
            // Persist the write intent before POST so a lost response cannot trigger a blind repeat.
            await github.rest.issues.updateComment({ ...progress, body: `${progressBody}\n\n${intent}` })
            if (!await isCurrent()) {
              await github.rest.issues.updateComment({ ...progress, body: progressBody })
              return partial('skipped')
            }
            try {
          if (process.env.TRIAL === 'race') {
            const { data } = await github.rest.issues.createComment({
              ...context.repo, issue_number: pull.pull_number, body: 'Lifecycle fixture: final preflight passed; ready for revision change.',
            })
            core.notice(`Timing signal: ${data.html_url}`)
            const deadline = Date.now() + 180_000
            while (await isCurrent()) {
              if (Date.now() >= deadline) throw new Error('Fixture revision did not move')
              await new Promise(resolve => setTimeout(resolve, 1000))
            }
          }
              const result = await github.rest.pulls.createReview({
                ...pull, commit_id: HEAD_SHA, event, body: `${body.trim()}\n\n— Huanˢⁱ ⚡\n\n${runMarker}`,
              })
              verdict = result.data
            } catch (error) {
              if ([400, 401, 403, 404, 422].includes(error.status)) {
                // GitHub rejected the write. A rerun may proceed once the intent is cleared.
                await github.rest.issues.updateComment({ ...progress, body: progressBody })
                throw error
              }
              partial('unconfirmed')
              verdict = await findVerdict()
              if (!verdict) throw error
            }
          }

          partial('unconfirmed')
          const target = { ...pull, review_id: verdict.id }
          const current = await isCurrent()
          if (verdict.state === 'DISMISSED') {
            return partial('dismissed')
          }
          if (!current) {
            try {
              await github.rest.pulls.dismissReview({
                ...target, message: 'Huanˢⁱ ⚡ withdrew this verdict because the reviewed HEAD or BASE changed.',
              })
            } catch (error) {
              const { data } = await github.rest.pulls.getReview(target)
              if (data.state !== 'DISMISSED') throw error
            }
            return partial('withdrawn')
          }
          // Only a confirmed automatic verdict completes a pair. Withdrawn verdicts never get this marker.
          if (context.eventName === 'pull_request_target' && !verdict.body.endsWith(pairMarker)) {
            await github.rest.pulls.updateReview({ ...target, body: `${verdict.body}\n\n${pairMarker}` })
          }
          partial('')
    - name: Finalize progress
      if: always() && steps.progress.outputs.comment_id != ''
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        COMMENT_ID: "${{ steps.progress.outputs.comment_id }}"
        RUN_STATUS: "${{ job.status }}"
        PARTIAL: "${{ steps.verdict.outputs.partial }}"
        DUPLICATE: "${{ steps.pair.outputs.duplicate }}"
        MODE: "${{ needs.authorize.outputs.mode }}"
      with:
        github-token: "${{ steps.app-token.outputs.token }}"
        script: |
          const comment = { ...context.repo, comment_id: Number(process.env.COMMENT_ID) }
          const { data } = await github.rest.issues.getComment(comment)
          const partial = {
            skipped: 'partial. The PR changed and the verdict was skipped',
            withdrawn: 'partial. The PR changed and the verdict was withdrawn',
            dismissed: 'partial. The verdict had already been dismissed',
            unconfirmed: 'partial. Verdict publication or withdrawal could not be confirmed. Inspect the PR before retrying',
          }[process.env.PARTIAL]
          const outcome = partial ?? (process.env.RUN_STATUS === 'success' && process.env.DUPLICATE === 'true'
              ? 'skipped. An automatic review and verdict already exist for this HEAD and BASE'
              : { success: 'completed', cancelled: 'cancelled' }[process.env.RUN_STATUS] ?? 'failed')
          const activity = process.env.MODE === 'review' ? 'Review' : 'Task'
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          const heading = outcome.startsWith('partial.') ? 'Partial review'
            : `${activity} ${outcome.split('.')[0]}`
          const body = data.body.replace(/^### Huanˢⁱ ⚡ · .*$/m, `### Huanˢⁱ ⚡ · ${heading}`)
          await github.rest.issues.updateComment({
            ...comment,
            body: `${body}\n\n**${activity} ${outcome}.** See the [Actions run](${run}).`,
          })
    - name: Finish request reactions
      if: always() && steps.reactions.outputs.endpoint != ''
      continue-on-error: true
      uses: actions/github-script@v8
      env:
        ENDPOINT: "${{ steps.reactions.outputs.endpoint }}"
        EYES_ID: "${{ steps.reactions.outputs.eyes_id }}"
        ROCKET_ID: "${{ steps.rocket.outputs.rocket_id }}"
        JOB_STATUS: "${{ job.status }}"
        AGENT_OUTCOME: "${{ steps.agent.outcome }}"
        PARTIAL: "${{ steps.verdict.outputs.partial }}"
        DUPLICATE: "${{ steps.pair.outputs.duplicate }}"
      with:
        github-token: "${{ steps.reaction-token.outputs.token || steps.app-token.outputs.token
          }}"
        script: |
          const { ENDPOINT, EYES_ID, ROCKET_ID, JOB_STATUS, AGENT_OUTCOME, PARTIAL, DUPLICATE } = process.env
          for (const id of [EYES_ID, ROCKET_ID].filter(Boolean)) {
            try {
              await github.request(`DELETE ${ENDPOINT}/${id}`)
            } catch (error) {
              if (error.status !== 404) core.warning(`Could not remove progress reaction: ${error.message}`)
            }
          }
          if (JOB_STATUS === 'success' && AGENT_OUTCOME === 'success' && !PARTIAL && DUPLICATE !== 'true') {
            await github.request(`POST ${ENDPOINT}`, { content: 'hooray' })
          }
'on':
  workflow_dispatch:
    inputs:
      number:
        description: Issue or same-repository PR number
        required: true
        type: string
      mode:
        description: Interact with an issue/PR or review a same-repository PR
        type: choice
        default: interaction
        options:
        - interaction
        - review
      task:
        description: Engineering task for interaction, or optional focus for review
        type: string
