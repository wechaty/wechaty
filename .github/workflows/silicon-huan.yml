name: Silicon Huan AGENTS discovery probe
on: workflow_dispatch
permissions: {}
env:
  AGY_CLI_DISABLE_AUTO_UPDATE: 'true'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install the same CLI and Linux credential backend
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agy" --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring libsecret-tools dbus-x11 >/dev/null
      - name: Compare headless runs with and without a root AGENTS.md
        shell: bash
        env:
          ANTIGRAVITY_AUTH_JSON: ${{ secrets.ANTIGRAVITY_AUTH_JSON }}
          ANTIGRAVITY_MODEL: ${{ vars.ANTIGRAVITY_MODEL }}
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "$RUNNER_TEMP/agents-md-probe.XXXXXX")"
          cleanup() {
            secret-tool clear service gemini username antigravity 2>/dev/null || true
            pkill -u "$USER" gnome-keyring-d 2>/dev/null || true
            rm -rf "$HOME/.local/share/keyrings" "$HOME/.gemini/config/mcp_config.json" "$private_dir"
          }
          trap cleanup EXIT
          eval "$(dbus-launch --sh-syntax)"
          pw="$(openssl rand -hex 24)"; echo "::add-mask::$pw"
          mkdir -p "$HOME/.local/share/keyrings"
          printf '%s' "$pw" | gnome-keyring-daemon --unlock --replace --daemonize --components=secrets >/dev/null
          unset pw
          for _ in $(seq 10); do printf probe | secret-tool store --label=probe service probe username probe 2>/dev/null && break; sleep 1; done
          secret-tool clear service probe username probe
          jq -e '(.token.refresh_token|type=="string") and (.auth_method|type=="string")' <<<"$ANTIGRAVITY_AUTH_JSON" >/dev/null
          printf '%s' "$ANTIGRAVITY_AUTH_JSON" | secret-tool store --label='gemini:antigravity' service gemini username antigravity
          unset ANTIGRAVITY_AUTH_JSON
          control="$private_dir/control"
          with_rules="$private_dir/with-rules"
          git init -q "$control"
          git init -q "$with_rules"
          expected="RULE_$(openssl rand -hex 12)"
          printf '# Workspace verification rule\n\nFor the workspace discovery probe, reply exactly %s and nothing else. Do not use tools.\n' "$expected" > "$with_rules/AGENTS.md"
          model=()
          if [[ -n "$ANTIGRAVITY_MODEL" ]]; then model=(--model "$ANTIGRAVITY_MODEL"); fi
          probe() {
            local root=$1 wanted=$2 label=$3
            if ! (cd "$root" && timeout 150s agy --dangerously-skip-permissions --print-timeout 120s --output-format json "${model[@]}" -p 'Workspace discovery probe: reply exactly NO_WORKSPACE_RULE unless a workspace rule supplies a different exact reply. Do not use tools or inspect any files.') > "$private_dir/$label.json" 2> "$private_dir/$label.err"; then
              echo "::error::$label headless invocation failed"
              return 1
            fi
            if ! jq -e --arg wanted "$wanted" '.status == "SUCCESS" and (.response | gsub("^\\s+|\\s+$"; "")) == $wanted' "$private_dir/$label.json" >/dev/null; then
              echo "::error::$label response was not the expected marker"
              return 1
            fi
            echo "$label: expected response matched"
          }
          probe "$control" NO_WORKSPACE_RULE control
          probe "$with_rules" "$expected" root-AGENTS
