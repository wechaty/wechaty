name: Silicon Huan reaction permission probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pull-permission: [read, write]
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID_HUAN }}
          private-key: ${{ secrets.APP_PRIVATE_KEY_HUAN }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: ${{ matrix.pull-permission }}
      - name: Probe create and delete on a disposable PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          comment=$(gh api --method POST "repos/$GITHUB_REPOSITORY/issues/3192/comments" -f body='Temporary Silicon Huan reaction permission probe.' --jq .id)
          trap 'gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$comment" --silent' EXIT
          endpoint="repos/$GITHUB_REPOSITORY/issues/comments/$comment/reactions"
          for phase in eyes rocket hooray; do
            id=$(gh api --method POST "$endpoint" -f content="$phase" --jq .id)
            gh api --method DELETE "$endpoint/$id" --silent
            echo "$phase create and delete succeeded"
          done
