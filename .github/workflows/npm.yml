name: NPM

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js 26 for tests
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies from lockfile
        run: |
          node --version
          npm --version
          npm ci

      - name: Run lint and unit tests
        run: npm test

  pack:
    name: Pack
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      is_publish_branch: ${{ steps.release_metadata.outputs.is_publish_branch }}
      release_version: ${{ steps.release_metadata.outputs.release_version }}
      npm_dist_tag: ${{ steps.release_metadata.outputs.npm_dist_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js 26 for packaging
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install dependencies from lockfile
        run: npm ci
      # Every workspace package publishes the same version (lockstep,
      # wechaty/wechaty#3054); `lockstep.ts check` fails the run otherwise.
      - name: Determine release version, publish branch and npm dist-tag
        id: release_metadata
        run: |
          node scripts/lockstep.ts check
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          const { SemVer } = require('@chatie/semver')
          const releaseVersion = execFileSync('node', [ 'scripts/lockstep.ts', 'version' ], { encoding: 'utf8' }).trim()
          // Project policy: prereleases and odd-minor versions use next.
          const npmDistTag = new SemVer(releaseVersion).isProd ? 'latest' : 'next'
          // Publish from main or version branches such as v1.10.
          const isPublishBranch = /^refs\/heads\/(main|v[0-9]+\.[0-9]+.*)$/.test(process.env.GITHUB_REF)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_version=${releaseVersion}\nnpm_dist_tag=${npmDistTag}\nis_publish_branch=${isPublishBranch}\n`)
          NODE
      # Builds every package's tarball in dependency order, installs them all
      # into a fresh project and runs the ding-dong smoke test.
      - name: Build and smoke-test the release tarballs
        run: scripts/pack-release.sh "$RUNNER_TEMP/release"
      - name: Upload tested release tarballs
        uses: actions/upload-artifact@v6
        with:
          name: npm-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && needs.pack.outputs.is_publish_branch == 'true'
    name: Publish
    needs: [validate, pack]
    runs-on: ubuntu-latest
    permissions:
      # contents: write creates the v<version> release tag.
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node.js 26 and npm registry
        uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
      - name: Verify npm supports Trusted Publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          node --input-type=commonjs - "$NPM_VERSION" <<'NODE'
          const npmVersion = process.argv[2]
          const versionMatch = /^(\d+)\.(\d+)\.(\d+)(?:\+[\w.-]+)?$/.exec(npmVersion)
          if (!versionMatch) throw new Error(`Unsupported npm version: ${npmVersion}`)
          const [ major, minor, patch ] = versionMatch.slice(1).map(Number)
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error('npm Trusted Publishing requires npm 11.5.1 or newer.')
          }
          NODE
      - name: Download tested release tarballs
        uses: actions/download-artifact@v7
        with:
          name: npm-release
          path: ${{ runner.temp }}/release
      # Publishes the tarballs that passed the smoke test, dependencies first,
      # skipping versions already on npm (a re-run finishes a partial release).
      # Each package must allow this repository and workflow as an npm
      # Trusted Publisher.
      - name: Publish the release to npm
        run: scripts/publish-release.sh "$RUNNER_TEMP/release" "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ needs.pack.outputs.npm_dist_tag }}
      - name: Tag the release
        run: |
          TAG="v$RELEASE_VERSION"
          if EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            if [ "$EXISTING" = "$GITHUB_SHA" ]; then
              echo "$TAG already points at $GITHUB_SHA."
            else
              echo "::warning::$TAG already exists at $EXISTING, not $GITHUB_SHA; leaving it."
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" --jq .ref
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.pack.outputs.release_version }}
